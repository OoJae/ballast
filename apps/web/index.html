<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eee8dc" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Ballast: NIGHT holders fill Strike's empty ask side with post-only asks from their own accounts, each covered by NIGHT that stays in their Cardano wallet. Every claim is checkable."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ballast · covered liquidity for Strike" />
    <meta
      property="og:description"
      content="NIGHT's ask side is empty within 0.5%. Ballast lets holders fill it, covered by coins that never leave their wallet."
    />
    <meta property="og:image" content="https://ballast-public-production.up.railway.app/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ballast-public-production.up.railway.app/brand/og.png" />
    <title>Ballast · covered liquidity for Strike</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint, so there is no flash.
      try {
        const saved = localStorage.getItem("ballast-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {
        // Storage blocked: follow the OS theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Ballast's public pages need JavaScript to read the replayed L3 book. The raw API is at
        <code>/api/health</code>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
